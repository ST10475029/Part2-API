name: RaceDay CI

on:
  push:
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore
        run: dotnet restore Part2-API/RaceDay.sln

      - name: Build
        run: dotnet build Part2-API/RaceDay.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Part2-API/RaceDay.sln --no-build --configuration Release --verbosity normal
